[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "surviving-the-show"
version = "3.5.0"
description = "Prospect outcome model and card buy list"
requires-python = ">=3.11"
dependencies = [
    "requests",
    "numpy",
    "pandas",
    "scipy",
    "scikit-learn",
    "xgboost",
    "torch",          # v3 sequence encoder and neural hazard
    "tqdm",
    "pybaseball",     # MLB outcomes, Lahman/Chadwick, draft-scrape fallback
    "ncaa_bbStats",   # packaged draft cache (1965-2025) + NCAA college stats
]

[project.optional-dependencies]
dev = ["pytest"]
research = ["pyarrow", "playwright"]

[project.scripts]
# The full historical data pull, packaged as one command. Defaults to the
# `all` phase; runs draft -> rankings -> outcomes -> milb+IFA -> dedup.
prospects-pull = "prospects.data.pull:main"
# The whole runbook as one command: pull -> outcomes -> snapshot -> oof ->
# hazards -> prod -> evaluate -> buy list. Resumable via --from <step>.
prospects-refresh = "prospects.refresh:main"

[tool.setuptools.packages.find]
# The importable package. `tools/` and `tests/` are deliberately excluded:
# they are run as scripts against an installed copy of the package, not
# imported by it.
include = ["prospects*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
